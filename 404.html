<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 - Page Not Found</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Inter", sans-serif;
        background: #eef5fd;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }

    .box {
        background: white;
        width: 80%;
        max-width: 750px;
        text-align: center;
        padding: 40px 30px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .illustration {
        width: 100%;
        max-width: 300px;
        margin: 0 auto 20px auto;
        display: block;
    }

    h1 {
        font-size: 4rem;
        font-weight: 700;
        margin: 10px 0;
        color: #57b7c0;
    }

    h2 {
        font-size: 1.8rem;
        margin: 0 0 15px 0;
        color: #111827;
    }

    p {
        font-size: 1rem;
        color: #4b5563;
        margin-bottom: 25px;
    }

    a.btn {
        background:  #57b7c0;
        padding: 12px 28px;
        font-size: 1.1rem;
        color: #fff;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        display: inline-block;
        transition: 0.3s ease;
    }

    a.btn:hover {
        background: #479aa2;
        transform: scale(.95);
    }
</style>
</head>

<body>

<div class="box">
    <!-- Bigger Animation -->
    <img class="illustration" src="https://cdn.dribbble.com/users/285475/screenshots/2083086/dribbble_1.gif" alt="404 Animation">

    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you’re trying to reach does not exist or may have been moved.</p>

    <a href="index.html" class="btn">Back to Home</a>
</div>

</body>
</html>
